version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:2.21.0-lts
    restart: always
    ports:
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
      - "${PORTAINER_EDGE_PORT:-8000}:8000" # optional Edge/agent listener
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - portainer_network

volumes:
  portainer_data:
    external: false

networks:
  portainer_network:
    driver: bridge
